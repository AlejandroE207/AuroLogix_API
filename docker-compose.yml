services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: "AuroLogix_API"
      APP_VERSION: "1.0.0"
      APP_DESCRIPTION: "AuroLogix es un WMS de Laboratorios Aurofarma. Todos los derechos reservados a Laboratorios Aurofarma S.A.S"
      APP_DOCS_URL: "/docs"
      APP_REDOC_URL: "/redoc"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 540
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # host.docker.internal apunta a "localhost" de TU máquina, visto desde dentro del contenedor
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@host.docker.internal:5432/${DB_NAME}
    ports:
      - "8000:8000"
    extra_hosts:
      # Necesario en Linux para que host.docker.internal funcione (en Docker Desktop de Windows/Mac ya viene resuelto)
      - "host.docker.internal:host-gateway"
